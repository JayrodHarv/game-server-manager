<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Game Server Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Game Server Manager</h1>

  <h2>Create Server</h2>
  <form id="createForm">
    Name: <input type="text" id="serverName" value="mc-test">
    Port: <input type="number" id="serverPort" value="25565">
    <button type="submit">Create</button>
  </form>
  <div id="createResult"></div>

  <h2>Servers</h2>
  <button id="refreshServers">Refresh List</button>
  <ul id="serverList"></ul>

  <h2>Console</h2>
  <textarea id="consoleOutput" rows="20" cols="80" readonly></textarea><br>
  <input type="text" id="consoleInput">
  <button id="sendConsole">Send</button>

  <script src="app.js"></script>
</body>
</html>
